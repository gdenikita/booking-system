<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель записей</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        h1 { margin-bottom: 20px; color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #4f46e5; color: white; font-weight: 600; }
        tr:hover { background: #f9fafb; }
        .status-new { color: #16a34a; font-weight: 600; }
        .empty { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <h1>📅 Записи клиентов</h1>
    {% if bookings %}
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Телефон</th>
                <th>Услуга</th>
                <th>Дата</th>
                <th>Время</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody>
            {% for b in bookings %}
            <tr>
                <td>{{ b.id }}</td>
                <td>{{ b.name }}</td>
                <td>{{ b.phone }}</td>
                <td>{{ b.service }}</td>
                <td>{{ b.date }}</td>
                <td>{{ b.time }}</td>
                <td class="status-new">{{ b.status }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <div class="empty">Пока нет записей. Запусти бота и создай первую!</div>
    {% endif %}
</body>
</html>
